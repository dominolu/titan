# Copy outside the checkout to a private directory. All relative paths resolve from this file.
# Replace paths, generated password hash and node credential environment reference before use.
schema_version = 1

[manager]
listen = "127.0.0.1:8040"
public_origin = "http://127.0.0.1:8040"
secure_cookie = false # Loopback development only; production uses HTTPS and true.
session_seconds = 3600
database = "state/manager.sqlite3"
web_root = "../web/console/dist"

[manager.nodes.build]
endpoint = "http://127.0.0.1:8041"
token_env = "TITAN_CONSOLE_BUILD_TOKEN"
environments = ["backtest"]

[[manager.users]]
username = "operator"
password_hash = "REPLACE_WITH_ARGON2_HASH_FROM_STDIN"
role = "operator"
nodes = ["build"]
accounts = []
environments = ["backtest"]

[node]
id = "build"
listen = "127.0.0.1:8041"
token_env = "TITAN_CONSOLE_BUILD_TOKEN"
work_root = "state/node"
titan_program = "../target/debug/titan"
history_program = "../target/debug/examples/v13_grid_history"
environments = ["backtest"]
task_seconds = 1800

[node.parameter_presets.grid]
strategy_id = "grid"
strategy_name = "网格策略"
source = "../strategies/grid/strategy.py"
parameters = "../strategies/grid/parameters.json"

# Register immutable, locally owned CSV sources. Each dataset needs all three inputs.
