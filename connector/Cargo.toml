[package]
name = "connector"
version = "0.1.0"
edition = "2024"

[features]
default = ["binancefutures", "okx", "hyperliquid", "evm", "solana"]
binancefutures = []
okx = []
hyperliquid = []
evm = []
solana = []

[dependencies]
hftbacktest = { path = "../hftbacktest" }
tracing = "0.1.43"
anyhow = "1.0.100"
thiserror = "2.0.17"
bincode = "2.0.1"
chrono = { version = "0.4.42" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = { version = "0.3.31" }
sha2 = "0.10.9"
hmac = "0.12.1"
async-trait = "0.1"
toml = "0.9.8"
titan-market-plugin = { path = "../crates/titan-market-plugin" }
titan-account-plugin = { path = "../crates/titan-account-plugin" }
titan-runtime-abi = { path = "../crates/titan-runtime-abi" }
titan-plugin-engine = { path = "../crates/titan-plugin-engine" }
tracing-subscriber = "0.3.22"
hashbrown = "0.16.1"
crc32fast = "1"
rand = "0.9.2"
ed25519-dalek = { version = "2.2.0", features = [
    "serde",
    "zeroize",
    "rand_core",
    "digest",
    "pkcs8",
    "pem",
] }
curve25519-dalek = "4.1"
bs58 = "0.5"
base64 = "0.22.1"
serde_qs = "0.15.0"
rmp-serde = "1.3"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
smallvec = { version = "1", features = ["serde"] }
alloy-primitives = "1.7"
alloy-sol-types = "1.7"
alloy-consensus = "2.4"
# ArbTxEnvelope::Legacy 的 payload 来自 arb_sequencer_consensus 依赖树里的 consensus 1.x，
# 测试需要同一实例的类型才能构造 envelope。
alloy-consensus-arb = { package = "alloy-consensus", version = "1.8" }
alloy-network = "2.4"
alloy-provider = { version = "2.4", features = ["ws", "reqwest"] }
alloy-transport = "2.4"
alloy-pubsub = "2.4"
alloy-eips = "2.4"
alloy-signer-local = "2.4"
alloy-transport-ws = "2.4"
alloy-rpc-types-eth = "2.4"
sequencer_client = "0.5"
arb-sequencer-consensus = "0.5"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
semver = "1"
titan-event-engine = { path = "../crates/titan-event-engine" }
titan-connector-loader = { path = "../crates/titan-connector-loader" }
