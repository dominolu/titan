[package]
name = "connector"
version = "0.1.0"
edition = "2024"

[features]
default = ["binancefutures", "okx", "hyperliquid"]
binancefutures = []
okx = []
hyperliquid = []

[dependencies]
hftbacktest = { path = "../hftbacktest" }
tracing = "0.1.43"
anyhow = "1.0.100"
thiserror = "2.0.17"
bincode = "2.0.1"
chrono = { version = "0.4.42" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots"] }
futures-util = { version = "0.3.31" }
sha2 = "0.10.9"
hmac = "0.12.1"
async-trait = "0.1"
toml = "0.9.8"
titan-market-plugin = { path = "../crates/titan-market-plugin" }
titan-account-plugin = { path = "../crates/titan-account-plugin" }
titan-plugin-engine = { path = "../crates/titan-plugin-engine" }
tracing-subscriber = "0.3.22"
hashbrown = "0.16.1"
crc32fast = "1"
rand = "0.9.2"
ed25519-dalek = { version = "2.2.0", features = [
    "serde",
    "zeroize",
    "rand_core",
    "digest",
    "pkcs8",
    "pem",
] }
base64 = "0.22.1"
serde_qs = "0.15.0"
rmp-serde = "1.3"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
semver = "1"
titan-event-engine = { path = "../crates/titan-event-engine" }
titan-connector-loader = { path = "../crates/titan-connector-loader" }
