# Solana 链上 venue（JSON-RPC 行情与原生交易构造工具）
#
# 当前统一账户激活/下单/账户快照/成交查询返回 Unsupported：尚缺真实 swap fill、
# 费用、spot 库存对账和共同币种估值；不能用于平台策略实盘交易。
# 原生 RPC/签名工具保留，不代表统一账户交易已验收。
# 同一份 TOML 用于行情连接（不需要 keypair）与账户连接（必须 keypair）。
# RPC/WS 可用不同主机；实测 solana-rpc.publicnode.com 支持 HTTP + WS（wss）。

rpc_url = "https://solana-rpc.publicnode.com"
ws_url = "wss://solana-rpc.publicnode.com"

# solana-keygen 格式 keypair（64 字节数字数组）。行情连接可留空。
# 注意：在公共 RPC 上 blockhash 必须用 finalized 档（connector 已内置处理）。
keypair_path = "/path/to/keypair.json"

# 优先费（micro-lamports / CU）。公共网络建议 >= 50_000。
priority_fee_micro_lamports = 100_000
compute_unit_limit = 300_000

# 市价单滑点保护（基点，双边）。
slippage_bps = 200
# AMM 手续费（基点），用于本地报价/滑点下限。Raydium V4 常见 25。
fee_bps = 25
# 确认等待超时；到期保留 pending 和原签名，报结果未知并交平台对账，不视为撤单。
tx_timeout_ms = 60000
book_levels = 10

