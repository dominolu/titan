# orderflow_events 只读主网行情冒烟模板（ABI V13 / HOST_DEPTH_100）。
# 该策略不声明 ORDER_EXECUTION：不会下单，不需要账户、密钥或资金；只订阅 BBO + 深度。
# 冒烟阶段允许未签名制品；正式部署前必须移除 allow_unsigned_artifacts 并配置 trusted_ed25519_keys。
schema_version = 1

[market_service]
max_sources = 4
max_instruments = 64
stop_timeout_ms = 15000

[strategy_service]
allowed_artifact_roots = ["artifacts"]
allow_unsigned_artifacts = true

[execution]
worker_threads = 2
max_active_tasks = 4096
shutdown_deadline_ms = 15000

# 以下为平台默认值，显式写出便于运维核对：
# market_batch 为 65536 B × 2048 槽、low_watermark 256；超块消息共享 128 MiB 在途字节预算。
[event_engine.arena]
market_overflow_bytes = 134217728

[[market_sources]]
source_key = "binance-btc-mainnet"
connector_type = "binance-futures"
# HOST_DEPTH_100 要求两侧各 >=100 档；Binance 快照必须配置 1000 档，低于 100 会在首个快照失败。
connector_config = '''
stream_url = "wss://fstream.binance.com/ws"
api_url = "https://fapi.binance.com"
depth_snapshot_limit = 1000
order_prefix = ""
api_key = ""
secret = ""
safety_timeout_ms = 30000
'''
# Binance connector canonicalises symbols to lowercase; published events use that casing.
instruments = [{ native_symbol = "btcusdt", asset_id = 1001, price_tick = { coefficient = 1, scale = 1 }, quantity_lot = { coefficient = 1, scale = 3 } }]
enabled = true
definition_version = 1

[[strategies]]
strategy_key = "orderflow_events"
strategy_id = 9501
# 编译后必须用 titan strategy show --json 的 compiled_strategy_digest 替换（见同目录 README）。
package = { loader_type = "native-v13", uri = "file://artifacts/orderflow_events.titan", expected_digest = [167, 190, 56, 181, 97, 8, 49, 209, 95, 69, 94, 240, 48, 55, 122, 27, 166, 47, 4, 177, 144, 41, 34, 164, 197, 160, 173, 2, 189, 191, 93, 169] }
markets = [
  { local_market_no = 0, local_asset_no = 0, source_key = "binance-btc-mainnet", asset_id = 1001, data_mode = "tick" },
]
accounts = []
risk_scope = "orderflow-events-mainnet-readonly"
runtime = { async_lane_capacity = 8192, critical_reserve = 2048, reliable_pending_capacity = 1024, worker_policy = "spin_sleep", timer_capacity = 64, timer_interval = { secs = 0, nanos = 100000000 }, max_handler_duration = { secs = 0, nanos = 100000000 }, startup_timeout = { secs = 30, nanos = 0 }, stop_timeout = { secs = 15, nanos = 0 } }
recovery = "fresh"
enabled = true
definition_version = 1
