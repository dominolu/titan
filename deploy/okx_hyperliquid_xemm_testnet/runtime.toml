schema_version = 1
connector_plugin_packages = ["plugins/okx/plugin.json", "plugins/hyperliquid/plugin.json"]

[event_engine.ingress]
max_sources = 8192

[[plugins]]
instance_id = "market"
plugin_type = "titan.market"
config = {}

[[plugins]]
instance_id = "account"
plugin_type = "titan.account"
config = { secret_root = "secrets", stop_timeout_ms = 15000 }

[[plugins]]
instance_id = "strategy"
plugin_type = "titan.strategy"
config = { allowed_artifact_roots = ["../../strategies"], python_paths = ["../../strategies", "../../python/titan-strategy-sdk"] }

[plugins.execution]
model = "Dedicated"

[[market_sources]]
source_key = "okx-btc-mainnet"
connector_type = "okx"
connector_config = '''
rest_url = "https://www.okx.com"
public_ws_url = "wss://ws.okx.com:8443/ws/v5/public"
private_ws_url = "wss://ws.okx.com:8443/ws/v5/private"
api_key = ""
secret = ""
passphrase = ""
simulated = false
proxy = ""
td_mode = "cross"
order_prefix = ""
safety_timeout_ms = 30000
'''
instruments = [{ native_symbol = "BTC-USDT-SWAP", asset_id = 1001, price_tick = { coefficient = 1, scale = 1 }, quantity_lot = { coefficient = 1, scale = 2 } }]
enabled = true
definition_version = 1

[[market_sources]]
source_key = "hyperliquid-btc-mainnet"
connector_type = "hyperliquid"
connector_config = '''
info_url = "https://api.hyperliquid.xyz/info"
exchange_url = "https://api.hyperliquid.xyz/exchange"
ws_url = "wss://api.hyperliquid.xyz/ws"
is_mainnet = true
safety_timeout_ms = 30000
'''
instruments = [{ native_symbol = "BTC", asset_id = 1002, price_tick = { coefficient = 1, scale = 1 }, quantity_lot = { coefficient = 1, scale = 5 } }]
enabled = true
definition_version = 1

[[accounts]]
account_key = "okx-maker-mainnet"
account_id = 2001
connector_type = "okx-account"
credential_ref = "secret://file/okx-mainnet.toml"
connector_config = '''
rest_url = "https://www.okx.com"
public_ws_url = "wss://ws.okx.com:8443/ws/v5/public"
private_ws_url = "wss://ws.okx.com:8443/ws/v5/private"
simulated = false
proxy = ""
td_mode = "cross"
order_prefix = ""
safety_timeout_ms = 30000
'''
instruments = [{ native_symbol = "BTC-USDT-SWAP", asset_id = 1001, price_tick = { coefficient = 1, scale = 1 }, quantity_lot = { coefficient = 1, scale = 2 }, contract_multiplier = { coefficient = 1, scale = 0 } }]
currencies = [{ native_currency = "USDT", currency_id = 1, amount_unit = { coefficient = 1, scale = 8 } }]
ownership = "ObserveAll"
shutdown_order_policy = "CancelAll"
enabled = true
definition_version = 1

[[accounts]]
account_key = "hyperliquid-hedge-mainnet"
account_id = 2002
connector_type = "hyperliquid-account"
credential_ref = "secret://file/hyperliquid-mainnet.toml"
connector_config = '''
info_url = "https://api.hyperliquid.xyz/info"
exchange_url = "https://api.hyperliquid.xyz/exchange"
ws_url = "wss://api.hyperliquid.xyz/ws"
is_mainnet = true
safety_timeout_ms = 30000
'''
instruments = [{ native_symbol = "BTC", asset_id = 1002, price_tick = { coefficient = 1, scale = 1 }, quantity_lot = { coefficient = 1, scale = 5 }, contract_multiplier = { coefficient = 1, scale = 0 } }]
currencies = [{ native_currency = "USDC", currency_id = 2, amount_unit = { coefficient = 1, scale = 8 } }]
ownership = "ObserveAll"
shutdown_order_policy = "CancelAll"
enabled = true
definition_version = 1

[[strategies]]
strategy_key = "okx_hyperliquid_xemm"
strategy_id = 9001
package = { loader_type = "numba-python", uri = "file://../../strategies/okx_hyperliquid_xemm", expected_digest = [132, 74, 23, 112, 233, 198, 15, 85, 68, 80, 26, 163, 16, 189, 229, 97, 14, 183, 64, 29, 253, 106, 85, 138, 172, 170, 195, 70, 13, 108, 56, 14] }
