parameter_schema_version = 1
markets = [
  { local_market_no = 0, local_asset_no = 0, source_key = "okx-btc-mainnet", asset_id = 1001, data_mode = "tick" },
  { local_market_no = 1, local_asset_no = 1, source_key = "hyperliquid-btc-mainnet", asset_id = 1002, data_mode = "tick" },
]
