  { local_account_no = 0, account_key = "okx-maker-mainnet", tradable_assets = [{ local_asset_no = 0, asset_id = 1001 }] },
  { local_account_no = 1, account_key = "hyperliquid-hedge-mainnet", tradable_assets = [{ local_asset_no = 1, asset_id = 1002 }] },
]
subscriptions = [
  { event_type = "titan.market.Bbo", schema_version = 1, routing_keys = [1001], qos = "Latest" },
  { event_type = "titan.market.DepthBatch", schema_version = 1, routing_keys = [1002], qos = "Latest" },
  { event_type = "titan.account.Fill", schema_version = 2, routing_keys = [2001, 2002], qos = "ReliableOrdered" },
]
risk_scope = "okx-hyperliquid-mainnet-shadow"
runtime = { async_lane_capacity = 8192, critical_reserve = 2048, reliable_pending_capacity = 1024, worker_policy = "spin_sleep", command_capacity = 64, timer_capacity = 64, timer_interval = { secs = 0, nanos = 100000000 }, state_f64_capacity = 1024, state_i64_capacity = 1024, callback_budget = { soft_budget = { secs = 0, nanos = 100000 }, stall_threshold = { secs = 0, nanos = 5000000 }, max_consecutive_violations = 3 }, startup_timeout = { secs = 30, nanos = 0 }, stop_timeout = { secs = 15, nanos = 0 } }
recovery = "fresh"
