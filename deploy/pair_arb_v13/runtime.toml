schema_version = 1

[market_service]
max_sources = 16
max_instruments = 4096
stop_timeout_ms = 15000

[account_service]
max_accounts = 32
max_instruments_per_account = 4096
max_currencies_per_account = 512
secret_root = "secrets"
startup_timeout_ms = 30000
stop_timeout_ms = 15000

[strategy_service]
allowed_artifact_roots = ["artifacts"]
checkpoint_root = "checkpoints"
# This checked-in deployment is disabled and intended for development/shadow validation only.
# Production must remove this flag and configure trusted_ed25519_keys.
allow_unsigned_artifacts = true

[execution]
worker_threads = 2
max_active_tasks = 8192
shutdown_deadline_ms = 15000

[event_engine.ingress]
max_sources = 8192

[[market_sources]]
source_key = "okx-btc-mainnet"
connector_type = "okx"
