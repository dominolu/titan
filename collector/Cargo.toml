[package]
name = "collector"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.42"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1.0.145"
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
anyhow = "1.0.100"
reqwest = { version = "0.12.24", features = ["json"] }
sha2 = "0.10.9"
hmac = "0.12.1"
thiserror = "2.0.17"
crc = "3.4.0"
flate2 = "1.1.5"
clap = { version = "4.5.53", features = ["derive"] }
toml = "0.9"
zstd = "0.13"
hftbacktest = { path = "../hftbacktest", default-features = false, features = ["backtest"] }
titan-l2-book = { path = "../crates/titan-l2-book" }
# The websocket transport, venue refusals and their backoff are shared with the live
# connector, so the behaviour of a refused request is defined once.
connector = { path = "../connector", default-features = false, features = ["binancefutures", "okx", "hyperliquid", "bybit"] }
titan-domain-types = { path = "../crates/titan-domain-types" }
titan-market-service = { path = "../crates/titan-market-service" }
zip = "6.0.0"
# The recorder holds an exclusive lock on its data directory; two writers on one directory
# interleave members and leave files no reader can decode.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }
