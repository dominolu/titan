[package]
name = "titan-market-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
titan-plugin-engine = { path = "../titan-plugin-engine" }
tracing = "0.1"

[dev-dependencies]
titan-event-engine = { path = "../titan-event-engine" }
