[package]
name = "titan-account-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
titan-core-types = { path = "../titan-core-types" }
titan-domain-types = { path = "../titan-domain-types" }
titan-persistence = { path = "../titan-persistence" }
titan-market-service = { path = "../titan-market-service" }
tracing = "0.1"
zeroize = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
titan-event-engine = { path = "../titan-event-engine" }
