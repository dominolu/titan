[package]
name = "titan-plugin-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
arc-swap = "1.7"
crossbeam-channel = "0.5"
core_affinity = "0.8"
jsonschema = { version = "0.33", default-features = false }
libloading = "0.8"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
loom = "0.7"
