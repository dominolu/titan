[package]
name = "titan-strategy-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
ed25519-dalek = "2"
libloading = "0.8"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
titan-account-service = { path = "../titan-account-service" }
titan-event-engine = { path = "../titan-event-engine" }
titan-market-service = { path = "../titan-market-service" }
titan-core-types = { path = "../titan-core-types" }
tracing = "0.1"
zip = { version = "6", default-features = false }

[dev-dependencies]
crossbeam-channel = "0.5"
