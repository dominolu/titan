[package]
name = "titan-python-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
build = "build.rs"

[dependencies]
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
serde_json = "1"
thiserror = "2"
titan-runtime-abi = { path = "../titan-runtime-abi" }

[build-dependencies]
pyo3-build-config = { version = "0.27.2", features = ["resolve-config"] }
