[package]
name = "titan-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[[bin]]
name = "titan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
hftbacktest = { path = "../../hftbacktest", default-features = false, features = ["backtest"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
signal-hook = "0.3"
sysinfo = "0.37"
titan-python-host = { path = "../titan-python-host" }
titan-runtime = { path = "../titan-runtime", default-features = false, features = ["backtest"] }
titan-runtime-abi = { path = "../titan-runtime-abi" }
titan-event-engine = { path = "../titan-event-engine" }
titan-plugin-engine = { path = "../titan-plugin-engine" }
titan-market-plugin = { path = "../titan-market-plugin" }
titan-account-plugin = { path = "../titan-account-plugin" }
titan-strategy-plugin = { path = "../titan-strategy-plugin", features = ["numba-loader"] }
titan-connector-loader = { path = "../titan-connector-loader" }
semver = "1"
