[package]
name = "titan-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[[bin]]
name = "titan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hftbacktest = { path = "../../hftbacktest", default-features = false, features = ["backtest", "live"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
signal-hook = "0.3"
sysinfo = "0.37"
titan-python-host = { path = "../titan-python-host" }
titan-runtime = { path = "../titan-runtime", default-features = false, features = ["backtest", "live"] }
titan-runtime-abi = { path = "../titan-runtime-abi" }
