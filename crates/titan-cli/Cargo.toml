[package]
name = "titan-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[[bin]]
name = "titan"
path = "src/main.rs"

[dependencies]
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
signal-hook = "0.3"
sysinfo = "0.37"
titan-event-engine = { path = "../titan-event-engine" }
titan-core-types = { path = "../titan-core-types" }
titan-market-service = { path = "../titan-market-service" }
titan-account-service = { path = "../titan-account-service" }
titan-strategy-runtime = { path = "../titan-strategy-runtime" }
connector = { path = "../../connector" }
semver = "1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing = "0.1"
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal", "io-util", "sync", "fs"] }
async-stream = "0.3"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
rand = "0.8"
argon2 = "0.5"
ts-rs = { version = "12", features = ["serde-json-impl"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
