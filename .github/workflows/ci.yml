name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TITAN_STRATEGY_SDK: ${{ github.workspace }}/python/titan-strategy-sdk
  TITAN_TEST_BINARY: ${{ github.workspace }}/target/debug/titan

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ./python/titan-strategy-sdk ./python/titan-reporting
      - run: echo "TITAN_STRATEGY_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: cargo build --locked -p titan-cli --bin titan
      - run: python -m unittest discover -s python/titan-reporting/tests -v
      - run: python -m unittest discover -s python/titan-strategy-sdk/tests -v
      - run: python -m compileall -q python/titan-strategy-sdk python/titan-reporting strategies

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ./python/titan-strategy-sdk
      - run: echo "TITAN_STRATEGY_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - name: Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --
          -D warnings
          -A dead-code
          -A clippy::should-implement-trait
          -A clippy::large-enum-variant
          -A clippy::type-complexity
          -A clippy::too-many-arguments
          -A clippy::unnecessary-filter-map
          -A clippy::collapsible-if
          -A clippy::ptr-arg
          -A clippy::needless-question-mark
          -A clippy::bool-assert-comparison
          -A clippy::items-after-test-module
          -A clippy::redundant-pattern-matching
          -A clippy::upper-case-acronyms

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - cargo test --workspace
          - cargo test --workspace --all-features
          - cargo test -p connector --features okx
          - cargo test -p connector --features hyperliquid
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ./python/titan-strategy-sdk
      - run: echo "TITAN_STRATEGY_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: ${{ matrix.command }}

  single-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_single_runtime.sh
